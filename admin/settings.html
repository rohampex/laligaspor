<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تنظیمات | مدیریت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/premium.css">
</head>
<body class="admin-layout">
  <main class="admin-main">
    <header>
      <div><h1>تنظیمات سایت</h1><p>اطلاعات تماس و شبکه‌های اجتماعی</p></div>
    </header>
    <div class="card" style="max-width:800px">
      <form id="settings-form">
        <div class="form-row"><div class="form-group"><label>نام فروشگاه</label><input class="input" name="siteName"></div></div>
        <div class="form-row"><div class="form-group"><label>متن فوتر</label><textarea class="textarea" name="footerText"></textarea></div></div>
        <div class="form-row two">
          <div class="form-group"><label>واتساپ</label><input class="input" name="whatsapp" dir="ltr"></div>
          <div class="form-group"><label>ایمیل</label><input class="input" name="contactEmail" dir="ltr"></div>
        </div>
        <div class="form-row two">
          <div class="form-group"><label>اینستاگرام (بدون @)</label><input class="input" name="instagram" dir="ltr"></div>
          <div class="form-group"><label>تلگرام</label><input class="input" name="telegram" dir="ltr"></div>
        </div>
        <div class="form-row"><div class="form-group"><label>آدرس فروشگاه</label><input class="input" name="address"></div></div>
        <div class="form-row"><div class="form-group"><label>ساعات کاری</label><input class="input" name="businessHours"></div></div>
        <div class="form-row"><div class="form-group"><label>Google Maps Embed URL</label><input class="input" name="mapEmbedUrl" dir="ltr"></div></div>
        <div class="modal-actions"><button type="submit" class="btn btn-primary">ذخیره تنظیمات</button></div>
      </form>
    </div>
  </main>
  <script src="/js/data.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/admin.js"></script>
  <script>
  (async function(){
    LLadmin.bootstrap('settings');
    const form = document.getElementById('settings-form');
    const s = await LLbackend.getSettings();
    Object.entries(s).forEach(([k,v]) => { if (form[k]) form[k].value = v || ''; });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {}; new FormData(form).forEach((v,k) => data[k] = v);
      await LLbackend.saveSettings(data);
      LLutil.toast('تنظیمات ذخیره شد');
    });
  })();
  </script>
</body>
</html>
