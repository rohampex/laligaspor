<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تماس با ما | لالیگا اسپرت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/premium.css">
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="text-center mb-8" style="max-width:600px;margin:0 auto 4rem" data-reveal>
        <h1 style="font-size:2.5rem;font-weight:900;margin-bottom:1rem">تماس با ما</h1>
        <p class="text-muted">هر سوال یا مشکلی دارید، خوشحال می‌شویم کمک کنیم.</p>
      </div>
      <div class="contact-grid">
        <div id="contact-info" data-reveal></div>
        <div class="contact-form" data-reveal>
          <h2>ارسال پیام</h2>
          <form id="contact-form" novalidate>
            <div class="form-row two">
              <div class="form-group">
                <label for="c-name">نام شما</label>
                <input class="input" id="c-name" type="text" placeholder="نام و نام خانوادگی" autocomplete="name">
              </div>
              <div class="form-group">
                <label for="c-phone">شماره تماس</label>
                <input class="input" id="c-phone" type="tel" placeholder="09xxxxxxxxx" autocomplete="tel" dir="ltr">
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="c-subject">موضوع</label>
              <input class="input" id="c-subject" type="text" placeholder="موضوع پیام شما">
            </div>
            <div class="form-group mb-4">
              <label for="c-msg">پیام شما</label>
              <textarea class="input textarea" id="c-msg" placeholder="پیام خود را اینجا بنویسید..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-round btn-lg">ارسال پیام</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/data.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/contact.js"></script>
  <script src="/js/scroll-reveal.js" defer></script>
</body>
</html>
